[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-kit"
version = "0.1.0"
description = "Library for answering from a knowledge base with an engineered LLM loop. Bring documents and instructions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Milan Jolly" }]
keywords = ["llm", "rag", "agents", "grok", "openai", "anthropic", "knowledge-base", "loop-engineering"]
# No "License ::" classifier: the SPDX `license` field above (PEP 639) replaces it,
# and setuptools warns when both are present.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
# OpenAI, Anthropic, and OpenAI-compatible servers are called with the standard
# library only. The xAI SDK (grpcio, protobuf, aiohttp, opentelemetry) is an
# extra so that users of the other providers do not have to install it.
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
xai = ["xai-sdk>=1.20.0"]
all = ["loop-kit[xai]"]
dev = [
    "loop-kit[all]",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.17,<0.18",  # keep in step with .pre-commit-config.yaml
    "mypy>=2.4,<3",  # keep in step with .pre-commit-config.yaml
    "build>=1.2",
    "twine>=5",
    "pre-commit>=3",
]

[project.scripts]
loopkit = "loopkit.cli:main"

[project.urls]
# These render as links in the PyPI sidebar. Replace OWNER with the GitHub user/org.
Homepage = "https://github.com/OWNER/loop-kit"
Repository = "https://github.com/OWNER/loop-kit"
Documentation = "https://github.com/OWNER/loop-kit#readme"
Changelog = "https://github.com/OWNER/loop-kit/blob/main/CHANGELOG.md"
Issues = "https://github.com/OWNER/loop-kit/issues"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loopkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is measured on every run, but the threshold is enforced only by
# `--cov-fail-under` (see [tool.coverage.report]) so a plain `pytest` stays fast
# and quiet when pytest-cov is not installed.
addopts = "-ra"

[tool.coverage.run]
source = ["loopkit"]
branch = true

[tool.coverage.report]
# Deliberately low for now: this is a "do not regress to zero" floor, not a target.
# Raise it as the test suite grows. CI reads this value via `pytest --cov`.
# If the project moves to Codecov later, the upload step goes in
# .github/workflows/ci.yml and this threshold can be replaced by Codecov's
# project/patch targets. See docs/maintainers.md.
fail_under = 5
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# An explicit rule set so that local runs and CI agree regardless of ruff's
# shifting defaults. Add rules here deliberately; do not rely on defaults.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi (typing hygiene)
    "ISC",  # implicit string concatenation
    "BLE",  # blind except
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is the formatter's job; long string literals are allowed
    "ISC001",  # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "BLE001",  # tests may catch broad exceptions on purpose
]

[tool.ruff.lint.isort]
known-first-party = ["loopkit"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
# xai-sdk ships without type stubs or a py.typed marker.
module = ["xai_sdk", "xai_sdk.*"]
ignore_missing_imports = true
