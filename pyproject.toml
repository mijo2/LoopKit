[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-kit"
version = "0.1.0"
description = "Library for answering from a knowledge base with an engineered LLM loop. Bring documents and instructions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Milan Jolly" }]
keywords = ["llm", "rag", "agents", "grok", "openai", "anthropic", "knowledge-base", "loop-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2",
    "xai-sdk>=1.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
loopkit = "loopkit.cli:main"

[project.urls]
Documentation = "https://docs.x.ai"
Source = "https://docs.x.ai/developers/quickstart"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loopkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
