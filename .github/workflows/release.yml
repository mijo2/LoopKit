# Release: push a tag like `v0.2.0` and this workflow builds the package,
# publishes it to PyPI, and creates a GitHub Release with generated notes.
#
# One-time setup before the first release (no secrets/tokens are stored here):
#   1. PyPI -> your project -> Publishing -> add a "Trusted Publisher":
#        owner: <github user/org>, repository: <repo>, workflow: release.yml,
#        environment: pypi
#      (For a project that does not exist on PyPI yet, use "pending publisher".)
#   2. GitHub -> Settings -> Environments -> New environment "pypi":
#        add yourself as a required reviewer, and restrict deployment branches/tags
#        to tags matching v*. The publish job then waits for your approval.
# See docs/maintainers.md ("Cutting a release") for the step-by-step.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*" # v1.2.3, v1.2.3rc1, v1.2.3.post1

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check that the tag matches pyproject.toml
        # Guards against tagging v0.2.0 while pyproject.toml still says 0.1.0.
        # (If the project later adopts setuptools-scm, this step goes away.)
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag pyproject=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Build
        run: python -m pip install --upgrade pip build twine && python -m build
      - name: Check
        run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/loop-kit/${{ github.ref_name }}
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC); no API token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # Reads dist/ by default. Attestations (PEP 740) are generated automatically.

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release and attach files
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *rc[0-9]*|*a[0-9]*|*b[0-9]*|*dev[0-9]*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease
